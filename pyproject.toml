[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-mibci-minirocket"
version = "0.1.0"
description = "Motor imagery EEG classification using MiniRocket and Hybrid CNN-LSTM based on Hwaidi & Ghanem (NeuroImage 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.2.0",
    "sktime>=0.20.0",
    "torch>=2.0.0",
    "mne>=1.4.0",
    "pyyaml>=6.0",
    "streamlit>=1.25.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]
